data:
  # extract_data_from_bag.py が生成した run-level split を指定する。
  train_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/train"
  val_dir: "/aichallenge/ml_workspace/tiny_lidar_net/dataset/val"
  max_range: 30.0
  max_sync_delta_sec: 0.05
  allowed_label_sources: ["mpc", "mpcc", "human", "lidar_gap_teacher", "lidar_gap_teacher_dagger", "lidar_precontact_teacher_dagger"]
  require_metadata: true

model:
  # "TinyLidarNet" または "TinyLidarNetSmall"
  name: "TinyLidarNet"
  # LiDARのスキャン点数
  input_dim: 750
  # 出力次元（[accel, steer]）
  output_dim: 2

train:
  seed: 2026
  batch_size: 64
  num_workers: 4
  epochs: 30
  lr: 0.0001
  
  early_stop_patience: 5

  # 事前学習済みモデルのパス（指定しない場合は null）
  pretrained_path: "/aichallenge/workspace/src/aichallenge_submit/tiny_lidar_net_controller/ckpt/tinylidarnet_weights.npy"

  # Empty means historical full-network fine tuning. For sparse corrective
  # adaptation, e.g. ["fc4"], all other layers are frozen and remain bit-identical.
  trainable_layers: []

  # 保存先設定
  save_dir: "/aichallenge/ml_workspace/tiny_lidar_net/checkpoints"
  log_dir: "/aichallenge/ml_workspace/tiny_lidar_net/logs"

  # 損失関数の重み設定
  loss:
    steer_weight: 1.0
    accel_weight: 0.0

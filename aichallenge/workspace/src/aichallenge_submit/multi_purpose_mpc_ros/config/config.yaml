common:
  save_config: false

sim_logger:
  animation_enabled: false

# Automotive AI Challenge 2026 official AWSIM item interface.
# Trigger once at the first healthy control cycle after /awsim/state becomes Start.
awsim_boost:
  # Default for ROS domains not listed in domain_enabled.
  enabled: true
  # Per-vehicle override keyed by ROS_DOMAIN_ID. Change a vehicle to false to disable Boost.
  domain_enabled:
    1: true
    2: true
    3: true
  mode: start_once
  status_timeout_sec: 0.5
  confirmation_timeout_sec: 2.0

# Staged wall-stuck recovery. The detector and all actuation are disabled by default so the
# existing MPC output is unchanged. Enable shadow_mode first and inspect logs before takeover.
stuck_recovery:
  enabled: false
  domain_enabled:
    1: false
    2: false
    3: false
  shadow_mode: true
  simulation_only: true
  # Independent safety latch. Keep false until AWSIM Reverse acceleration semantics are measured.
  reverse_actuation_enabled: false
  # TBD: measured adapter sign only (-1 or +1). Zero intentionally prevents reverse actuation.
  reverse_acceleration_sign: 0.0
  # TBD: signed acceleration verified to stop while physical gear remains Reverse.
  reverse_stop_acceleration_mps2: 0.0
  # TBD: achieved positive deceleration measured from signed odometry while stopping in Reverse.
  verified_reverse_stop_deceleration_mps2: 0.0
  # Measured command-to-effect delay; included in the physical stopping-distance reserve.
  reverse_control_latency_sec: 0.1
  boost_status_timeout_sec: 0.5
  detector:
    stopped_speed_mps: 0.15
    moving_speed_mps: 0.25
    forward_intent_speed_mps: 1.0
    forward_intent_acceleration_mps2: 0.1
    stationary_duration_sec: 1.2
    max_pose_displacement_m: 0.15
    max_progress_delta_m: 0.20
    # Wait beyond the documented AWSIM wall-recovery motion before considering our own action.
    awsim_recovery_settle_sec: 1.2
  gear:
    report_timeout_sec: 0.5
    stop_confirm_sec: 0.3
    command_resend_interval_sec: 0.2
    max_command_requests: 1
  maneuver:
    clearance_wait_timeout_sec: 1.0
    max_reverse_distance_m: 0.8
    max_reverse_duration_sec: 2.0
    # Positive magnitude only; reverse_acceleration_sign is applied by the ROS/AWSIM adapter.
    reverse_acceleration_magnitude_mps2: 0.3
    escape_distance_m: 0.30
    max_reverse_pose_step_m: 0.25
    max_attempts: 1
  footprint:
    # Pose-to-collider correspondence is still TBD; these are current vehicle-sheet estimates.
    front_extent_m: 1.49
    rear_extent_m: 0.51
    left_extent_m: 0.725
    right_extent_m: 0.725
    margin_m: 0.05
    sweep_interpolation_step_m: 0.05
  rear_safety:
    # Total entries in each V2X array (include self if AWSIM publishes self).
    # -1 means unknown and intentionally blocks Reverse until the race layout is confirmed.
    expected_v2x_vehicle_count: -1
    # unknown blocks Reverse. Use excluded only if V2X officially excludes self; otherwise
    # use vehicle_id and set the exact self_vehicle_id.
    self_filter_mode: unknown
    self_vehicle_id: ""
    vehicle_radius_m: 1.45
    prediction_margin_sec: 0.1
  rejoin:
    speed_limit_mps: 1.0
    max_lateral_error_m: 0.5
    max_heading_error_rad: 0.35
    confirm_sec: 0.3
    timeout_sec: 5.0
    cooldown_sec: 1.0

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv.csv"
  domain_csv_path:
    1: "env/final_ver3/traj_mincurv.csv"
    2: "env/final_ver3/traj_mincurv_org.csv"
    3: "env/final_ver3/traj_mincurv_org.csv"
  resolution: 0.6
  smoothing_distance: 2
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 1.45   # +safety margin

mpc:
  N: 30
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [100000.0, 0.0]
  a_min: -1.6 # m/s^2
  a_max: 1.0 # m/s^2
  domain_a_max:
    1: 1.0
    2: 1.0
    3: 1.0
  delta_max_deg: 32.0 # degrees
  steer_rate_max: 1.2 # rad/s
  control_rate: 40.0 # Hz
  odom_timeout_sec: 0.5 # [s], steady-clock local safety timeout (not an official limit)
  min_linearization_speed_mps: 0.5 # [m/s], avoid singular 1/v terms below this speed
  steering_tire_angle_gain_var: 1.5
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0
  steer_low_pass_gain: 1.0
  # Temporary limitation (2026-07-11): keep both waypoint offsets at 0.
  # A nonzero offset can mismatch the MPC state/reference frames in tight curves and cause
  # OSQP failure; change only after fixing the frame handling and testing the first hairpin.
  wp_id_low_offset: 0
  wp_id_low_speed: 15.0 # km/h
  wp_id_offset: 0
  # 1.0 = target the center of path constraints, 0.0 = target the edited trajectory.
  center_bias: 0.0
  # 1.0 = current safety margin, 0.0 = no additional safety margin.
  safety_margin_scale: 0.0
  # V2X-based rule gap planner. Keep disabled for baseline trajectory tracking.
  use_v2x_gap_planner: true
  # Forbidden lateral radius for ego center around a V2X vehicle.
  # 1.45m = other vehicle half width 0.725m + ego half width 0.725m.
  # Add a small buffer for low-speed side pass stability.
  v2x_vehicle_radius: 1.45
  v2x_vehicle_length: 2.0
  v2x_prediction_margin: 0.1
  v2x_prediction_time: 1.0
  v2x_timeout_sec: 1.0
  v2x_position_jump_threshold: 5.0
  v2x_v_max_safety: 30.0
  v2x_self_filter_radius: 0.3
  gap_min_width: 1.8
  gap_target_bias: 0.8
  no_gap_target_velocity: 2.0
  # Prefer the vehicle side when a free gap is bounded by a wall and a V2X vehicle.
  v2x_wall_clearance_margin: 0.8      # [m] shrink the wall side of the selected V2X gap
  v2x_vehicle_side_target_margin: 0.2 # [m] keep this margin from the inflated vehicle interval
  v2x_wall_avoidance_bias: 0.0        # 0.0 = gap center, 1.0 = vehicle side
  # Do not aim for a narrow gap between two moving V2X vehicles at close range.
  v2x_vehicle_vehicle_gap_enabled: false
  v2x_vehicle_vehicle_gap_min_distance: 18.0 # [m] only used when vehicle-vehicle gap is enabled
  v2x_vehicle_vehicle_gap_min_width: 3.2     # [m] only used when vehicle-vehicle gap is enabled
  v2x_multi_front_gap_enabled: false
  v2x_multi_front_gap_distance: 18.0 # [m] with 2+ front vehicles, use no-gap velocity instead
  # V2X behavior FSM. When true, Cruise/Follow/Overtake/SafetyBrake controls when gap planner is allowed.
  use_v2x_behavior_fsm: true
  v2x_behavior_debug_log_enabled: true # Phase4: periodically log why Follow/Overtake was selected
  v2x_behavior_debug_log_period_sec: 1.0
  v2x_follow_distance: 14.0        # [m]
  v2x_safety_brake_distance: 6.0  # [m] minimum distance; dynamic stop distance is also applied
  v2x_safety_brake_margin: 3.0    # [m] added to v^2 / (2 * abs(a_min))
  v2x_follow_gap_planner_enabled: false # Follow tracks the base path; lateral pass is only Overtake/low-speed avoidance
  v2x_follow_gap_planner_no_gap_speed_limit_enabled: false # do not yield just because no gap is found
  v2x_follow_gap_planner_respect_overtake_forbidden: true # do not side-attack in hairpins/forbidden zones
  v2x_follow_speed_limit_enabled: false # when false, Follow does not cap velocity
  v2x_follow_velocity: 3.0        # [m/s]
  v2x_follow_preposition_enabled: true # keep Follow slightly off the front vehicle's direct wake
  v2x_follow_preposition_offset: 0.9 # [m] soft lateral reference offset while following
  v2x_follow_preposition_min_side_clearance: 1.4 # [m] require pass-side room before offsetting
  v2x_follow_preposition_target_bias: 0.4 # weak reference only; constraints are not narrowed
  v2x_follow_preposition_ramp_ratio: 1.4 # higher = slower lateral drift while following
  v2x_front_decel_guard_enabled: true
  v2x_front_decel_guard_distance: 0.0     # [m] straight sections do not get a follow speed cap
  v2x_front_decel_guard_ttc: 0.0          # [s] straight sections do not get a follow speed cap
  v2x_front_decel_guard_speed_margin: 1.2 # [m/s] target <= front speed + margin
  v2x_front_decel_guard_min_closing_speed: 2.0 # [m/s] avoid capping while merely tucked in
  v2x_front_decel_guard_curve_include_slow_front: true # hairpin guard must follow heavily slowing cars too
  v2x_front_decel_guard_curve_lateral_margin: 1.5 # [m] catch cars that cut into our path in hairpins
  v2x_front_decel_guard_curve_lookahead_distance: 4.0 # [m] enable front speed matching only near hairpins
  v2x_front_decel_guard_curve_distance: 10.0 # [m] earlier cap when overtake is forbidden in curves
  v2x_front_decel_guard_curve_ttc: 2.8       # [s] earlier TTC cap in curves
  v2x_front_risk_arbitration_enabled: true   # Phase1: required-decel based braking guard
  v2x_front_risk_brake_prepare_limit_enabled: true # cap speed before the front gap collapses
  v2x_front_risk_avoid_candidate_limit_enabled: true # cap speed when an avoidable front risk is found
  v2x_front_risk_comfort_decel: 2.0          # [m/s^2] start smooth speed cap above this
  v2x_front_risk_hard_decel: 4.0             # [m/s^2] stronger speed cap above this
  v2x_front_risk_emergency_decel: 8.0        # [m/s^2] force SafetyBrake above this
  v2x_front_risk_distance_margin: 2.0        # [m] keep this clearance from front vehicle
  v2x_front_risk_min_closing_speed: 0.5      # [m/s] ignore nearly matched speed
  v2x_front_risk_prepare_time: 0.5           # [s] subtract closing distance during reaction delay
  v2x_front_risk_curve_limit_enabled: true   # in curves, cap speed before emergency braking is needed
  v2x_front_risk_curve_limit_required_decel: 1.1 # [m/s^2] start curve-only cap before a_min is exceeded
  v2x_front_risk_curve_limit_decel: 1.2      # [m/s^2] assumed feasible decel for curve-only cap
  v2x_front_risk_curve_limit_speed_margin: 0.5 # [m/s] keep slight race margin over front speed
  v2x_safety_brake_velocity: 0.0  # [m/s]
  # Gap width is measured after inflating V2X vehicles by ego+other half width.
  # Keep this as center-line slack, not raw vehicle width.
  v2x_overtake_min_gap_width: 0.8 # [m]
  v2x_overtake_max_curvature: 0.03
  v2x_overtake_block_inner_curve_pass: true # do not dive into the inside of hairpin curves
  v2x_overtake_forbidden_curve_lookahead_distance: 8.0 # [m] block overtake only near/in hairpins; keep straights raceable
  v2x_overtake_gap_lookahead_distance: 24.0 # [m] search farther than MPC horizon for slow-front pass
  v2x_overtake_try_both_sides: true         # before ShiftOut, retry the opposite side if preferred gap is blocked
  v2x_overtake_velocity_advantage: 1.0      # [m/s] soft reference over front speed; never overrides hard caps
  v2x_overtake_guard_enabled: true
  v2x_overtake_guard_min_gap_width: 0.8       # [m] center-line slack after inflated obstacles
  v2x_overtake_guard_min_gap_points: 2        # require consecutive horizon points before Overtake
  v2x_overtake_guard_min_prepare_distance: 5.0 # [m] do not dive into gaps that appear too late
  v2x_overtake_guard_max_lateral_shift: 0.0   # [m] disabled; use time-based lateral accel guard instead
  v2x_overtake_guard_reachable_gap_enabled: true # reject gaps that require excessive lateral accel
  v2x_overtake_guard_max_lateral_accel: 3.2   # [m/s^2] max required lateral accel to reach gap
  v2x_overtake_guard_min_gap_time: 0.7        # [s] reject gaps that appear too late at current speed
  v2x_overtake_guard_min_speed_for_reachable: 1.0 # [m/s] lower bound for reachability time estimate
  v2x_overtake_guard_min_front_distance: 3.0  # [m] keep too-close cases in Follow/SafetyBrake
  v2x_overtake_close_follow_enabled: true     # allow side target when tucked close but relative speed is small
  v2x_overtake_close_follow_min_front_distance: 1.5 # [m] do not side-escape from bumper-touch distance
  v2x_overtake_close_follow_max_closing_speed: 0.8 # [m/s] only allow if front speed is nearly matched
  v2x_overtake_close_follow_min_side_clearance: 2.0 # [m] require enough room before close-follow side target
  v2x_overtake_before_curve_enabled: true     # allow slow-front overtake in soft curve-lookahead zones
  v2x_overtake_before_curve_max_front_speed: 12.0 # [m/s] front vehicle is slow enough to justify pass
  v2x_overtake_before_curve_min_speed_advantage: 1.0 # [m/s] ego must be faster by this margin
  v2x_overtake_start_curve_clearance_distance: 3.0 # [m] do not start a new pass just before hairpins
  v2x_overtake_continue_in_forbidden_enabled: false # moving vehicles should follow/brake, not keep passing in hairpins
  v2x_overtake_front_velocity_limit_enabled: false # do not match front speed while a reachable overtake gap exists
  v2x_overtake_fallback_ignore_soft_curve_forbidden: false # avoid wall-side fallback targets in hairpins
  v2x_overtake_fallback_min_side_clearance: 1.2 # [m] required pass-side clearance for fallback target
  v2x_overtake_curve_cooldown_enabled: true # suppress immediate re-overtake after a curve-related abort
  v2x_overtake_curve_cooldown_sec: 1.5      # [s] prevents left/right target flip inside hairpins
  v2x_side_overtake_enabled: true # treat side-by-side vehicles as overtake candidates, not passive Follow only
  v2x_side_overtake_ignore_soft_curve_forbidden: false # do not side-pass moving vehicles in hairpins
  v2x_overtake_target_ramp_enabled: true      # start lateral target before the front vehicle enters MPC horizon
  v2x_overtake_target_ramp_ratio: 1.2         # higher = ramp pass-side target more gently
  v2x_overtake_line_enabled: true            # explicit ShiftOut/Pass/Return lateral line; off keeps legacy behavior
  v2x_overtake_line_shift_distance: 8.0       # [m] distance to blend from current lateral to pass-side line
  v2x_overtake_line_pass_distance: 8.0        # [m] pass-side hold distance hint
  v2x_overtake_line_return_distance: 10.0     # [m] distance to blend back to the base trajectory
  v2x_overtake_line_lateral_offset: 1.2       # [m] signed by pass side: left positive, right negative
  v2x_overtake_line_target_bias: 0.8          # [0-1] weight of explicit overtake line in xr[e_y]
  v2x_overtake_line_min_wall_clearance: 0.8   # [m] keep target away from path constraint edge
  v2x_overtake_line_max_lateral_accel: 2.5    # [m/s^2] clamp target movement if lateral accel is excessive
  v2x_overtake_line_max_target_change: 0.25   # [m/cycle] smooth target goal updates across cycles
  v2x_overtake_line_return_clear_distance: 4.0 # [m] locked target must be this far behind before Return
  v2x_overtake_line_phase_hold_time: 0.3      # [s] minimum phase hold before transition
  v2x_overtake_target_hold_sec: 0.30          # [s] tolerate brief front/side classification loss
  v2x_overtake_clear_confirm_sec: 0.30        # [s] require target rear-clear observation before Return
  v2x_overtake_reacquire_enabled: true        # allow same target/side to return to Pass early in Return
  v2x_overtake_reacquire_window_sec: 0.50     # [s] maximum Return age for a safe reacquire
  v2x_overtake_reacquire_max_return_progress: 0.25 # [0-1] do not reverse a mostly completed Return
  v2x_overtake_recovery_velocity_limit_enabled: true # explicit abort/return cap; does not affect successful Pass
  v2x_overtake_recovery_velocity: 3.0         # [m/s] dedicated Recovery cap, independent of v2x_follow_velocity
  v2x_overtake_solver_failure_abort_cycles: 3 # consecutive failures before aborting the lateral pass target
  v2x_overtake_line_debug_log_enabled: true   # log phase changes when enabled
  v2x_moving_front_speed_threshold: 1.0 # [m/s] above this, Follow uses moving-front behavior
  v2x_moving_follow_speed_margin: 4.0   # [m/s] speed margin over the moving front vehicle
  v2x_moving_safety_brake_distance: 2.0 # [m] minimum brake distance for moving front vehicles
  v2x_moving_safety_brake_margin: 0.5   # [m] added to relative-speed stopping distance
  v2x_moving_safety_brake_time_headway: 0.15 # [s] speed-dependent emergency margin
  v2x_start_grid_grace_time: 1800.0      # [s] keep stop-vehicle behavior suppressed during race start tests
  v2x_require_gap_for_overtake: true
  v2x_low_speed_avoidance_enabled: true
  v2x_low_speed_avoidance_ignore_soft_curve_forbidden: true # gate2: allow stopped-vehicle bypass in curve-lookahead zones
  use_v2x_local_path_planner: true
  v2x_low_speed_avoidance_distance: 10.0         # [m] close stopped/slow vehicle bypass range
  v2x_low_speed_avoidance_lookahead_distance: 18.0 # [m] include multiple stopped vehicles in gate2-like layouts
  v2x_low_speed_avoidance_velocity: 11.1         # [m/s]
  v2x_low_speed_avoidance_max_front_speed: 0.2   # [m/s] only treat truly stopped vehicles as bypass targets
  v2x_low_speed_avoidance_min_prepare_distance: 6.0 # [m] too close should brake/follow, not start lateral bypass
  v2x_low_speed_avoidance_min_gap_width: 0.5     # [m] checked after wall clearance shrink
  v2x_low_speed_avoidance_min_gap_points: 2      # require consecutive safe gap points before entering bypass
  v2x_low_speed_avoidance_clear_distance: 8.0    # [m] keep low-speed bypass until clear of nearby V2X vehicles
  v2x_local_path_pass_clearance: 3.0             # [m] stay on pass-side path after the last stopped vehicle
  v2x_local_path_return_distance: 6.0            # [m] distance used to blend back to base trajectory
  v2x_local_path_invert_target: false            # invert local-path lateral target before MPC tracking
  v2x_low_speed_pass_side: "auto"                # auto, left, right. Auto selects the wider feasible pass side.
  v2x_low_speed_pass_ramp_ratio: 1.0             # lower = reach the side-pass target earlier
  v2x_overtake_forbidden_wp_ranges: []
  v2x_state_hold_time: 0.1        # [s]
  use_max_kappa_pred: true



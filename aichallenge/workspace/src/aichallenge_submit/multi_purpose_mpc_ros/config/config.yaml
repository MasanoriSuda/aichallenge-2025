  v2x_overtake_line_early_side_replan_stable_sec: 0.25 # [s] suppress left/right observation chatter
  v2x_overtake_line_early_side_replan_max_locked_side_lateral_speed: 0.25 # [m/s] do not flip while still moving into the locked side
  v2x_overtake_line_side_replan_target_guard_distance: 8.0 # [m] measured ordering conflict; hard intrusion remains 2 m

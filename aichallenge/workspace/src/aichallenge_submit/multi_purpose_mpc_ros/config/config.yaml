  v2x_overtake_reacquire_window_sec: 0.50     # [s] maximum Return age for a safe reacquire
  v2x_overtake_reacquire_max_return_progress: 0.25 # [0-1] do not reverse a mostly completed Return
  v2x_overtake_recovery_reacquire_enabled: true # resume ShiftOut when the same safe gap reopens during Recovery
  v2x_overtake_recovery_velocity_limit_enabled: true # explicit abort/return cap; active Pass uses its own locked-target cap
  v2x_overtake_recovery_velocity: 5.0         # [m/s] dedicated Recovery cap, independent of v2x_follow_velocity
  v2x_overtake_recovery_stall_speed: 0.15     # [m/s] continuous low speed starts bounded Recovery stall timer
  v2x_overtake_recovery_stall_timeout_sec: 1.0 # [s] release a line Recovery that cannot restart
  v2x_overtake_recovery_timeout_sec: 5.0      # [s] absolute bound for one Recovery phase
  v2x_overtake_recovery_max_observation_gap_sec: 0.2 # [s] reject discontinuous distance integration
  v2x_overtake_line_entry_retry_cooldown_sec: 1.0 # [s] do not reselect the same target/side after a geometric line failure
  v2x_overtake_follow_prepare_timeout_sec: 4.0 # [s] end a paused mission and compare both sides again
  v2x_overtake_follow_prepare_max_distance: 20.0 # [m] distance bound for one paused mission

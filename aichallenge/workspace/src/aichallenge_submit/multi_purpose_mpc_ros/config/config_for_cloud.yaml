  v2x_low_speed_avoidance_shift_lateral_gain: 0.4 # [1/m^2] short-shift lateral feedback
  v2x_low_speed_avoidance_shift_heading_gain: 1.3 # [1/m] damp heading error during the shift
  v2x_low_speed_avoidance_shift_lateral_tolerance: 0.4 # [m] settle near corridor target before MPC handoff
  v2x_low_speed_avoidance_shift_heading_tolerance: 0.2 # [rad] do not hand off while still heavily yawed
  v2x_low_speed_avoidance_shift_clear_hold_sec: 2.0 # [s] ignore brief front/side detection gaps before MPC handoff
  v2x_low_speed_avoidance_stopped_confirmation_samples: 3 # distinct valid V2X speed samples; control-loop repeats do not count
  v2x_low_speed_avoidance_stopped_confirmation_max_gap_sec: 1.0 # [s] reset confirmation after a V2X observation gap
  v2x_low_speed_avoidance_max_lateral_accel: 6.0 # [m/s^2] actual-speed cap for direct shift steering
  v2x_low_speed_avoidance_max_front_speed: 0.2   # [m/s] only treat truly stopped vehicles as bypass targets
  v2x_low_speed_avoidance_min_prepare_distance: 3.0 # [m] sim: allow close stopped-front bypass when a corridor is feasible
  v2x_low_speed_avoidance_min_gap_width: 0.5     # [m] checked after wall clearance shrink
  v2x_low_speed_avoidance_min_gap_points: 2      # require consecutive safe gap points before entering bypass
  v2x_low_speed_avoidance_clear_distance: 8.0    # [m] keep low-speed bypass until clear of nearby V2X vehicles
  # Abort a local stopped-vehicle pass that has physically stopped making progress. The pass
  # target is reset and held off briefly so side-only stalls can enter bounded stuck recovery.
  v2x_low_speed_avoidance_stall_speed: 0.15       # [m/s]
  v2x_low_speed_avoidance_stall_timeout_sec: 1.5  # [s]
  v2x_low_speed_avoidance_stall_cooldown_sec: 3.0 # [s]
  v2x_low_speed_avoidance_stall_max_observation_gap_sec: 0.2 # [s]
  v2x_local_path_pass_clearance: 3.0             # [m] stay on pass-side path after the last stopped vehicle
  v2x_local_path_return_distance: 6.0            # [m] distance used to blend back to base trajectory
  v2x_local_path_invert_target: false            # invert local-path lateral target before MPC tracking
  v2x_low_speed_pass_side: "auto"                # auto, left, right. Auto selects the wider feasible pass side.
  v2x_low_speed_pass_ramp_ratio: 1.0             # preserve the solver-stable lateral ramp
  v2x_overtake_forbidden_wp_ranges: []
  v2x_state_hold_time: 0.1        # [s]
  use_max_kappa_pred: true



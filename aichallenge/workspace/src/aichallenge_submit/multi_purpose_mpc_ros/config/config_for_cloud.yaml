  # a lateral Recovery beside the target and close to the wall.
  v2x_overtake_safe_separation_progress_loss_disengage_enabled: true
  v2x_overtake_safe_separation_progress_loss_stale_sec: 0.75 # [s]
  v2x_overtake_safe_separation_progress_loss_regression_distance: 0.30 # [m]
  v2x_overtake_safe_separation_disengage_speed_delta: 1.50 # [m/s] target passes ahead quickly
  v2x_overtake_safe_separation_disengage_max_sec: 3.0 # [s] bounded same-side disengagement
  v2x_overtake_safe_separation_full_speed_forward_escape_enabled: true # release target+delta cap after body-clear commit; course/input hard limits still win
  v2x_overtake_safe_separation_mission_aligned_budget_enabled: true # freeze a local window large enough for the selected Mission rear-clear estimate
  v2x_overtake_safe_separation_completion_distance_margin: 1.0 # [m] reserve after the live predicted rear-clear point
  v2x_overtake_safe_separation_completion_time_margin_sec: 0.5 # [s] acceleration/tracking reserve within the absolute Pass bound
  v2x_overtake_safe_separation_tactical_revalidation_enabled: true # preserve the committed Pass line/speed briefly while both sides are re-evaluated
  v2x_overtake_safe_separation_tactical_revalidation_max_sec: 0.50 # [s] bounded prediction-only revalidation lease
  v2x_overtake_safe_separation_tactical_revalidation_max_distance: 3.0 # [m] distance bound for the same lease
  # A complete rear-clear rollout may disappear before the current hard-safe path does.
  # Keep that validated prefix only while measured progress and all physical guards stay clear.
  v2x_overtake_safe_separation_safe_prefix_enabled: true
  v2x_overtake_safe_separation_safe_prefix_max_front_distance: 12.0 # [m] never chase an escaped target indefinitely
  v2x_overtake_safe_separation_safe_prefix_min_remaining_distance: 2.0 # [m] static wall/corridor validated prefix still available
  v2x_overtake_safe_separation_safe_prefix_replan_lead_sec: 0.50 # [s] try a fresh complete Mission before the local bound

/**:
  ros__parameters:
    log_interval_sec: 5.0        # 推論統計ログを出す間隔（秒）
    
    model:
      input_dim: 750            # LiDARスキャンの入力次元
      output_dim: 2              # 出力（steering, throttleなど）
      architecture: "normal"      # "normal" または "small"
      ckpt_path: "/path/to/tinylidarnet_weights.npy"
      # Empty by default: production remains the admitted base policy.
      residual_ckpt_path: ""
      residual_max_abs_delta_rad: 1.28
      residual_architecture: stateless
      # Conservative direct-node template. Participant launch owns the
      # qualified packaged production defaults and overrides these values.
      spatial_shadow_ckpt_path: ""
      spatial_shadow_expected_sha256: ""
      spatial_shadow_hidden_dim: 128
      spatial_shadow_projection_dim: 128
      spatial_shadow_use_speed: true
      spatial_shadow_use_base_steering: false
      spatial_shadow_max_speed_mps: 12.0
      spatial_shadow_max_abs_delta_rad: 1.2
      spatial_authority_enabled: false
      spatial_authority_max_abs_delta_rad: 0.12
      # A checkpoint alone is diagnostic-only. Recurrent steering authority
      # additionally requires its default-off authority flag and SHA identity.
      recurrent_shadow_ckpt_path: ""
      recurrent_shadow_expected_sha256: ""
      recurrent_shadow_hidden_dim: 64
      recurrent_shadow_projection_dim: 128
      recurrent_shadow_use_speed: false
      recurrent_shadow_speed_embedding_dim: 16
      recurrent_shadow_max_speed_mps: 12.0
      recurrent_shadow_max_abs_correction_rad: 0.64
      recurrent_shadow_correction_deadband_rad: 0.02
      recurrent_authority_enabled: false
      recurrent_authority_max_abs_correction_rad: 0.24

    max_range: 30.0              # LiDARの最大レンジ（メートル）
    control_mode: "fixed_lidar_brake"  # ML steer + LiDAR longitudinal safety
    acceleration: 0.8            # qualified bounded-pace launch acceleration
    maximum_forward_speed_mps: 4.6  # seed 2035/2036 NPC Gate, penalty/stall zero

    # Shared obstacle policy. Only gap_teacher may modify lateral control.
    gap_teacher:
      trigger_distance_m: 7.0
      slow_distance_m: 3.0
      stop_distance_m: 1.5
      bubble_margin_m: 0.25
      vehicle_half_width_m: 0.725
      steering_angle_gain: 0.75
      side_start_angle_rad: 1.3
      side_trigger_distance_m: 1.8
      side_critical_distance_m: 0.9
      side_cluster_points: 3
      brake_acceleration_mps2: -1.0

    # Diagnostic successor to precontact_teacher. It consumes fresh wheel
    # speed, grows the physical preview envelope and prevents late side flips.
    speed_committed_teacher:
      reaction_time_sec: 0.25
      preview_time_sec: 0.50
      release_confirmation_samples: 5
      side_switch_confirmation_samples: 2
      minimum_commit_speed_mps: 0.50

    # Runtime safety contract. When LiDAR stops, do not retain the last drive command.
    sensor_timeout_sec: 0.25
    watchdog_period_sec: 0.05
    startup_grace_sec: 2.0
    stale_brake_acceleration: -1.0
    spatial_shadow_speed_timeout_sec: 0.1
    max_steering_angle_rad: 0.64

    debug: false
